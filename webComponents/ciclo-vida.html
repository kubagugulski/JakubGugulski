<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ciclo de vida Web Component</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    button { margin-right: 10px; padding: 8px 12px; }
    #contenedor { margin: 20px 0; }
  </style>
</head>
<body>

  <h1>Ciclo de vida de un Web Component</h1>
  <p>Abre la consola (F12) y pulsa los botones.</p>

  <button id="btn-crear">Crear y añadir</button>
  <button id="btn-cambiar">Cambiar atributo</button>
  <button id="btn-eliminar">Eliminar</button>

  <div id="contenedor"></div>

  <script>
    class MiComponente extends HTMLElement {

      // atributos que queremos observar
      static get observedAttributes() {
        return ['texto'];
      }

      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        console.log('Creado');
      }

      connectedCallback() {
        console.log('Adjuntado al DOM');
        this.render();
      }

      disconnectedCallback() {
        console.log('Separado del DOM');
      }

      attributeChangedCallback(name, oldValue, newValue) {
        console.log(`Cambio en el atributo "${name}": ${oldValue} -> ${newValue}`);
        this.render();
      }

      render() {
        const texto = this.getAttribute('texto') || 'sin texto';
        this.shadowRoot.innerHTML = `
          <style>
            div { border: 2px solid green; padding: 10px; width: 200px; }
          </style>
          <div>Componente: ${texto}</div>
        `;
      }
    }

    customElements.define('mi-componente', MiComponente);

    let componente = null;
    let contador = 0;

    document.getElementById('btn-crear').addEventListener('click', () => {
      if (componente) return; // solo uno
      componente = document.createElement('mi-componente');
      document.getElementById('contenedor').appendChild(componente);
    });

    document.getElementById('btn-cambiar').addEventListener('click', () => {
      if (!componente) return;
      contador++;
      componente.setAttribute('texto', 'hola ' + contador);
    });

    document.getElementById('btn-eliminar').addEventListener('click', () => {
      if (!componente) return;
      componente.remove();
      componente = null;
    });
  </script>

</body>
</html>
